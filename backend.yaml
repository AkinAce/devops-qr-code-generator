apiVersion: apps/v1
kind: Deployment  
metadata:
  name: qr-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qr-api 
  template:
    metadata:
      labels:
        app: qr-api  
    spec:
      containers:
      - name: qr-api 
        image: akinace/qr-code-api:latest #Image to build from 
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: qr-api-service
spec:
  type: ClusterIP #To enable commuunication between the backend and frontend within the EKS cluster 
  selector:
    app: qr-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

#kubectl apply -f backend.yaml  to deploy the backend application to the EKS cluster.        